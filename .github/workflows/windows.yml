name: Windows build
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the zip as the latest release"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-v1
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache, out | Out-Null
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows 2>&1 | Tee-Object out/build.log
          cmake --build build --config Release -- /m /v:minimal 2>&1 | Tee-Object -Append out/build.log
          if (!(Test-Path build/Release/xstream.exe)) { exit 1 }
      - name: Add the video engine (libmpv, LGPL build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view -R zhongfly/mpv-winbuild --json assets -q '.assets[].name')
          echo "$names" > out/mpv-assets.txt
          pick=$(echo "$names" | grep -E '^mpv-dev-lgpl-x86_64-[0-9]' | head -1)
          [ -z "$pick" ] && pick=$(echo "$names" | grep -E '^mpv-dev-x86_64-[0-9]' | head -1)
          echo "using $pick" | tee -a out/build.log
          gh release download -R zhongfly/mpv-winbuild -p "$pick" -D mpv
          7z x -y -ompv mpv/*.7z > /dev/null
          cp mpv/libmpv-2.dll build/Release/ || find mpv -name "*.dll" | tee -a out/build.log
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md build/Release/
          Compress-Archive -Path build/Release/* -DestinationPath out/Xstream-TV-windows.zip -Force
          Get-ChildItem build/Release | Format-Table Name, Length | Out-String | Add-Content out/build.log
      - name: Publish release
        if: github.event.inputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="win-${{ github.run_number }}"
          gh release create "$tag" out/Xstream-TV-windows.zip --title "Xstream TV for Windows (build ${{ github.run_number }})" --notes-file RELEASE_NOTES.md --latest
      - name: Save logs to the ci-windows branch
        if: always()
        shell: bash
        run: |
          cd out && rm -f *.zip
          git init -q && git checkout -q -b ci-windows
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "run ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-windows
