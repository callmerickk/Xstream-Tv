name: Linux build + screenshots
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      script:
        description: "Test script for the app (see hosts/desktop/main_sdl.c)"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libfreetype-dev libharfbuzz-dev libcurl4-openssl-dev libgl-dev libmpv-dev xvfb mesa-utils gdb >/dev/null
      - name: Build
        run: |
          set -o pipefail
          mkdir -p out
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo 2>&1 | tee out/build.log
          cmake --build build -j4 2>&1 | tee -a out/build.log
      - name: Run and take screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          mkdir -p out/shots
          S="${SCRIPT:-14:SHOT=out/shots/1-home.png;15:DOWN;16:DOWN;17:RIGHT;18:SHOT=out/shots/2-home-rows.png;19:DOWN;20:DOWN;22:SHOT=out/shots/3-home-scrolled.png;23:OK;29:SHOT=out/shots/4-detail.png;30:BACK;31:SEARCH;32:TEXT=batman;38:SHOT=out/shots/5-search.png;39:QUIT}"
          cd build && timeout 150 xvfb-run -a -s "-screen 0 1280x720x24" gdb -q -batch -ex run -ex bt -ex "info locals" --args ./xstream --script "$(echo "$S" | sed 's#out/#../out/#g')" > ../out/run.log 2>&1 || echo "exit $?" >> ../out/run.log
          tail -40 ../out/run.log
      - name: Save logs and screenshots to the ci-linux branch
        if: always()
        run: |
          cd out
          git init -q && git checkout -q -b ci-linux
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "run ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-linux
